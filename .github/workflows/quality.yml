name: Quality Probes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    # Draft pull requests skip every job. A skipped context satisfies the ruleset, a draft cannot merge, and
    # ready_for_review re-runs the workflow before a merge is possible.
  workflow_dispatch:

# Read-only token: this workflow never writes to the repo.
permissions:
  contents: read

# One live run per pull request: a new push supersedes the previous run, and the previous run is canceled. Dispatch
# evidence runs are never canceled. Their group falls back to the ref, and cancellation applies only to pull_request
# events.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here blocks merge. The build, test and coverage gate lives in pr-check.yml, and the AddressSanitizer probe
# in sanitizers.yml. scripts/check_workflow_topology.py fails a PR that restores an advisory marker on any of them.

jobs:
  format-check:
    name: clang-format (blocking)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        run: pip install "clang-format==20.*"
        shell: bash

      - name: Check formatting (dry run, project sources only)
        run: |
          # git ls-files lists only this repo's tracked files, so submodule
          # sources under external/ are never formatted.
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
        shell: bash

      - name: Check comment-marker conventions
        # Runs even if the formatting step above reported violations.
        if: ${{ !cancelled() }}
        run: python scripts/check_comment_style.py
        shell: bash

  header-hygiene:
    name: header-encapsulation hygiene (blocking)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    # A public header that re-includes the SafetyHook backend, a hook::MidContext definition, or an async-logger
    # internal leaking onto the documented surface is a broken encapsulation contract, not a style opinion.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check header-encapsulation hygiene
        run: python scripts/check_header_hygiene.py
        shell: bash

  mechanical-style:
    name: mechanical naming/namespace/dash probe (blocking)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    # Covers only the rules a machine can decide by reading a line; the rest of AGENTS.md stays a review concern.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check mechanical naming/namespace/dash rules
        run: python scripts/check_mechanical_style.py
        shell: bash

  backend-patch:
    name: vendored backend-patch model (blocking)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    # external/safetyhook is pinned to an upstream-served commit and DMK's backend fixes are re-applied from
    # cmake/safetyhook_patches/ at configure time. This gate FAILS the PR if that model breaks: a fork repoint, an
    # emptied patch directory, a fix edited out of the patch, or a patch that no longer reconstructs the reviewed
    # tree. Checking out with the submodule also proves a fresh clone can resolve the pin from the configured remote.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Self-test the backend-patch checker
        run: python scripts/test_check_backend_patch.py
        shell: bash

      - name: Check the pristine pinned backend input
        # Runs even if the self-test above reported a failure, for a complete report. Nothing has applied the patch
        # yet, so this is the fresh-clone state: the pinned base and nothing else. A tracked edit, staged content, or
        # an untracked source that arrived some other way would be compiled into the backend just as the patch is.
        if: ${{ !cancelled() }}
        run: python scripts/check_backend_patch.py --expect-state pristine
        shell: bash

      - name: Apply the vendored patch the way a configure does
        # cmake -P runs the same cmake/DMKBackendPatch.cmake a configure runs, so this proves the production apply
        # path rather than a workflow-local re-implementation of it, and needs no compiler to do so.
        if: ${{ !cancelled() }}
        run: |
          cmake -DDMK_SUBMODULE_DIR="${{ github.workspace }}/external/safetyhook" \
                -DDMK_PATCH_DIR="${{ github.workspace }}/cmake/safetyhook_patches" \
                -P cmake/DMKBackendPatch.cmake
        shell: bash

      - name: Re-run the configure boundary on the configured backend
        # The step above drove the module from the pristine pin, where every target is written by the apply itself. A
        # repeat configure takes the idempotent branch instead: each patch reverse-applies, nothing is written, and the
        # backend the build compiles is decided entirely by the module's own equality verdict. That is the branch a
        # same-target byte drift survives, so it is exercised as its own required input rather than left implied.
        if: ${{ !cancelled() }}
        run: |
          cmake -DDMK_SUBMODULE_DIR="${{ github.workspace }}/external/safetyhook" \
                -DDMK_PATCH_DIR="${{ github.workspace }}/cmake/safetyhook_patches" \
                -P cmake/DMKBackendPatch.cmake
        shell: bash

      - name: Check the configured backend equals the reviewed patch output
        # The other side of the model: what the build actually compiles must be the pinned base plus exactly the
        # reviewed delta, byte for byte. Ordinary untracked content is only the configure-time lock; ignored content
        # is confined to reviewed non-source generated-output roots.
        if: ${{ !cancelled() }}
        run: python scripts/check_backend_patch.py --expect-state patched
        shell: bash

  workflow-contract:
    name: workflow contract and release identity (blocking)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    # The topology checker is what keeps every other required route required, so a change that weakened it would
    # otherwise be reviewed only by the checker it weakened. Its self-test, the identity helper's self-test, and the
    # repository-positive run are three explicit blocking steps here rather than a ctest reached by one toolchain.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test the workflow topology checker
        run: python scripts/test_check_workflow_topology.py
        shell: bash

      - name: Self-test the release identity checker
        # Runs even if the mutation matrix above reported a failure, for a complete report.
        if: ${{ !cancelled() }}
        run: python scripts/test_check_release_identity.py
        shell: bash

      - name: Check this repository against the canonical workflow contract
        # The positive control. A checker that refuses every mutation but also refuses the real workflows would fail
        # here, and one that accepts the real workflows only because it stopped reading them fails the self-test above.
        if: ${{ !cancelled() }}
        run: python scripts/check_workflow_topology.py --repository-root .
        shell: bash

  clang-tidy:
    name: clang-tidy (blocking)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    # Standalone rather than a compile launcher, and blocking. The curated .clang-tidy deliberately keeps
    # WarningsAsErrors empty so a developer's local build is not gated by an analyser; the override that makes findings
    # fail belongs on this command line, where it applies to the required route and nowhere else. No baseline count and
    # no blanket suppression are used, so a new finding fails here even though every recorded one is resolved.
    env:
      MINGW_BIN: C:\mingw64\bin
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false

      - name: Add MinGW to PATH
        run: echo "${{ env.MINGW_BIN }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Install clang-tidy
        # Pinned to the clang-tidy major the .clang-tidy profile targets, matching the clang-format pin above.
        run: pip install "clang-tidy==20.*"
        shell: bash

      - name: Configure (compile database only, library sources)
        # Only the compile database is wanted here; the analysis runs as its own command below. Tests are off so the
        # database describes the library's own translation units.
        # The database is consumed by Clang, so suppress the cached GCC-only warning flag that g++ otherwise contributes.
        run: cmake --preset mingw-debug -DDMK_BUILD_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DDMK_HAS_WDANGLING_REFERENCE=OFF
        shell: bash

      - name: Analyse library sources (warnings are errors)
        # --target is required. The database records MinGW g++ commands, but Windows clang defaults to the MSVC target.
        # Under the MS ABI, clang reports impossible GCC-flag results and misses the GNU-only include block.
        # That mismatch causes two parse errors in src/internal/scan_engine.cpp. Pin the database compiler triple.
        run: |
          clang-tidy -p build/mingw-debug --quiet \
            --warnings-as-errors='*' \
            --extra-arg=--target=x86_64-w64-windows-gnu \
            --extra-arg=-Werror \
            $(git ls-files 'src/*.cpp' 'src/internal/*.cpp')
        shell: bash
