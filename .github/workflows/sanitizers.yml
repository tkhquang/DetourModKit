name: AddressSanitizer probe

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/v4.0.0-*']
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character commit SHA to test"
        required: true
        type: string
      deliberate_asan_red:
        description: "Run the real ASan failure probe after the green full suite"
        required: true
        type: boolean
        default: false

# Read-only token: this workflow never writes to the repo.
permissions:
  contents: read

# MSVC AddressSanitizer is the only sanitizer that works on Windows (GCC and Clang on mingw-w64 ship no ASan/UBSan
# runtime for the Windows target, so the build links only under MSVC, and ASan is the only sanitizer there). This job
# carries no continue-on-error, so a sanitizer report, a build failure or a failing test fails the run and its
# conclusion counts as evidence. It runs on pull requests, on push to main and `release/v4.0.0-*`, and on dispatch.
# pr-check.yml owns the uninstrumented build, test and coverage gate; this lane is the instrumented one.

jobs:
  sanitizers:
    name: AddressSanitizer probe (MSVC, blocking)
    runs-on: windows-latest
    # A hang must not burn the 360-minute default now that the lane can fail a gate. The measured job is ~20 minutes,
    # of which the ASan ctest is ~16, so 40 leaves headroom without hiding a stall.
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false

      - name: Assert the manual dispatch resolved to the exact candidate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'expected_sha must be one full 40-character commit SHA.'
          }
          $checked_out_sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'git rev-parse HEAD failed.'
          }
          if (-not $env:EXPECTED_SHA.Equals($env:EVENT_SHA, [StringComparison]::OrdinalIgnoreCase) -or
              -not $env:EXPECTED_SHA.Equals($checked_out_sha, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Dispatch candidate mismatch: expected $env:EXPECTED_SHA, event $env:EVENT_SHA, " +
              "checkout $checked_out_sha."
          }
          Write-Host "Exact-candidate check passed at $checked_out_sha."
        shell: pwsh

      - name: Set up MSVC (x64) -- puts cl and the ASan runtime on PATH
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure (MSVC Debug + ASan)
        run: cmake --preset msvc-debug-asan
        shell: pwsh

      - name: Build
        # Cap cl fan-out to avoid C1060 heap exhaustion on the hosted runner, as pr-check.yml does for the
        # uninstrumented MSVC leg. ASan instrumentation raises per-cl memory, so the cap matters more here.
        run: cmake --build --preset msvc-debug-asan --parallel 2
        shell: pwsh

      - name: Run tests under ASan
        # Includes the fault-containment proofs, which tests/fault now registers on both toolchains. Their deliberate
        # access violations stay inside a frame-based __except in the proof's own process, so ASan's unhandled-exception
        # filter never sees them and a red here is a genuine sanitizer finding, not the injected fault.
        run: ctest --preset msvc-debug-asan --output-on-failure
        shell: pwsh

      - name: Build deliberate ASan failure probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deliberate_asan_red }}
        run: cmake --build --preset msvc-debug-asan --target dmk_asan_failure_probe --parallel 2
        shell: pwsh

      - name: Run deliberate ASan failure probe (expected red)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deliberate_asan_red }}
        # Do not catch or invert the probe's exit. A capable ASan run reports heap-buffer-overflow and fails the
        # workflow, so only a Failure that carries that diagnostic is the capability proof. Losing instrumentation
        # does not produce a quiet green to read instead: the same write past the allocation then trips the debug CRT
        # heap check and the probe blocks until the job timeout, which is a Failure carrying no diagnostic at all.
        # The location comes from the file the ASan configure generates from $<TARGET_FILE:dmk_asan_failure_probe>,
        # never from a hand-written output path, because a red from a stale path proves nothing and looks the same.
        run: |
          $published = 'build/msvc-debug-asan/dmk_asan_failure_probe_path.txt'
          if (-not (Test-Path -LiteralPath $published -PathType Leaf)) {
            throw "The ASan configure published no probe location at '$published'."
          }
          $probe = (Get-Content -LiteralPath $published -Raw).Trim()
          if (-not (Test-Path -LiteralPath $probe -PathType Leaf)) {
            throw "Probe '$probe' does not exist, so this run cannot be a capability proof."
          }
          & $probe
        shell: pwsh
