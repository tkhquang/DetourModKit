# Dependabot reads this repository config, not configs in vendored submodules.
# Pin workflow actions to full commit SHAs.
# Follow docs/design/build-ci.md#workflow-contract for action update PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      github-actions:
        patterns:
          - "*"
