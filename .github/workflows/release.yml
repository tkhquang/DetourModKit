name: DetourModKit - Build and Release

permissions:
  contents: read
  actions: read

# Two modes, one graph. `preflight` runs the whole producer, package, soak and benchmark-evidence graph and stops
# there: it holds no release credential, creates no tag, and publishes no release, so the final audit can run against a
# candidate that has already been through every job it will face. `publish` adds the one job that creates the annotated
# tag and the GitHub Release, and that job still refuses anything but refs/heads/main at the exact dispatched SHA.
# There is no manual tag step after it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight runs every gate without publishing; publish additionally tags and releases"
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - publish
      version:
        description: "Release version (e.g., 1.0.0, 0.2.1-beta)"
        required: true
        type: string
      expected_sha:
        description: "Exact 40-character commit SHA to build and, from main, tag"
        required: true
        type: string
      release_title:
        description: "Title for the release (e.g., 'Feature Update X')"
        required: false
        type: string
      changelog:
        description: "Changelog for this release (Markdown format)"
        required: false
        type: string
        default: "- Initial release or bug fixes."
      prerelease:
        description: "Mark as a pre-release?"
        required: true
        type: boolean
        default: false

jobs:
  validate-version:
    name: Validate exact candidate and release version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only checkout: this job only greps the sources, so the token must not persist in .git/config after
          # checkout. Only create-release keeps credentials (it pushes the release tag).
          persist-credentials: false

      - name: Assert the dispatch resolved to the exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::expected_sha must be one full 40-character commit SHA."
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "Expected candidate: ${EXPECTED_SHA}"
          echo "Dispatch event    : ${EVENT_SHA}"
          echo "Checked out       : ${CHECKED_OUT_SHA}"
          if [ "${EXPECTED_SHA,,}" != "${EVENT_SHA,,}" ] || \
             [ "${EXPECTED_SHA,,}" != "${CHECKED_OUT_SHA,,}" ]; then
            echo "::error::The dispatch ref did not resolve to expected candidate ${EXPECTED_SHA}."
            exit 1
          fi
          echo "Exact-candidate check passed."
        shell: bash

      - name: Compare release input against project(VERSION) in CMakeLists.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Single-source the release version from CMakeLists.txt project(VERSION ...): the shipped
          # DetourModKitConfigVersion.cmake and the DMK_VERSION_* macros are generated from that number, so a tag
          # whose version disagrees with it would publish a package whose find_package check contradicts the tag.
          # Fail closed here rather than shipping the mismatch.
          SAFE_VERSION_CORE='^[0-9]+\.[0-9]+\.[0-9]+'
          SAFE_VERSION_SUFFIX='(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          SAFE_VERSION_REGEX="${SAFE_VERSION_CORE}${SAFE_VERSION_SUFFIX}"
          if [[ ! "${INPUT_VERSION}" =~ ${SAFE_VERSION_REGEX} ]]; then
            echo "::error::Release version must be SemVer-shaped and contain only numeric core fields" \
              "and safe prerelease/build identifiers."
            exit 1
          fi
          # Strip any pre-release / build suffix (e.g. 3.7.0-beta -> 3.7.0); CMake project() is numeric MAJOR.MINOR.PATCH.
          INPUT_CORE="${INPUT_VERSION%%[-+]*}"
          PROJECT_VERSION="$(grep -oP 'project\(DetourModKit\s+VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)"
          echo "Release input version : ${INPUT_VERSION} (core: ${INPUT_CORE})"
          echo "CMakeLists project ver: ${PROJECT_VERSION}"
          if [ -z "${PROJECT_VERSION}" ]; then
            echo "::error::Could not parse project(VERSION ...) from CMakeLists.txt"
            exit 1
          fi
          if [ "${INPUT_CORE}" != "${PROJECT_VERSION}" ]; then
            echo "::error::Release version '${INPUT_VERSION}' does not match CMakeLists.txt project(VERSION) '${PROJECT_VERSION}'. Bump project(VERSION) first so the shipped ConfigVersion and DMK_VERSION_* macros match the tag."
            exit 1
          fi
          # Cross-check the one literal version assertion in the test suite (VersionTest.MacrosMatchProjectVersion) against
          # project(VERSION). project(VERSION) drives the generated DMK_VERSION_* macros, but the test pins them with a
          # hand-written literal that a bump must touch separately; without this gate a bump that updates CMakeLists but
          # forgets tests/test_version.cpp still tags and only fails later at ctest. Fail closed here at validate time.
          # grep -m1 (first match) rather than piping to head, and `|| true` so a no-match yields an empty string
          # instead of aborting the step: this job runs under GitHub Actions' default `bash -eo pipefail`, where a
          # `grep ... | head` pipeline propagates grep's non-zero exit and `set -e` would kill the step before the
          # empty-value guard below could emit its diagnostic. With this form a missing literal reaches that guard.
          TEST_MAJOR="$(grep -m1 -oP 'DMK_VERSION_MAJOR,\s*\K[0-9]+' tests/test_version.cpp || true)"
          TEST_MINOR="$(grep -m1 -oP 'DMK_VERSION_MINOR,\s*\K[0-9]+' tests/test_version.cpp || true)"
          TEST_PATCH="$(grep -m1 -oP 'DMK_VERSION_PATCH,\s*\K[0-9]+' tests/test_version.cpp || true)"
          TEST_VERSION="${TEST_MAJOR}.${TEST_MINOR}.${TEST_PATCH}"
          echo "test_version.cpp literal: ${TEST_VERSION}"
          if [ -z "${TEST_MAJOR}" ] || [ -z "${TEST_MINOR}" ] || [ -z "${TEST_PATCH}" ]; then
            echo "::error::Could not parse the DMK_VERSION_* literals from tests/test_version.cpp"
            exit 1
          fi
          if [ "${TEST_VERSION}" != "${PROJECT_VERSION}" ]; then
            echo "::error::tests/test_version.cpp literal '${TEST_VERSION}' does not match CMakeLists.txt project(VERSION) '${PROJECT_VERSION}'. Update the VersionTest.MacrosMatchProjectVersion literals so the pinned assertion tracks the bump."
            exit 1
          fi
          echo "Version check passed."
        shell: bash

  build-mingw:
    name: Build for MinGW (g++)
    runs-on: windows-latest
    timeout-minutes: 120
    needs: validate-version
    outputs:
      artifact_name: ${{ steps.determine-artifact-name-mingw.outputs.ARTIFACT_NAME }}
      artifact_zip_filename: ${{ steps.determine-artifact-name-mingw.outputs.ARTIFACT_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          # Build-only checkout: no authenticated git operation runs here, so do not persist the token in .git/config.
          persist-credentials: false

      - name: Cache MinGW
        id: cache-mingw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\ProgramData\chocolatey\lib\mingw
          key: ${{ runner.os }}-mingw-13.2.0-v2

      - name: Install MinGW (if not cached)
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        run: choco install mingw --version=13.2.0 --yes --force --no-progress
        shell: powershell

      - name: Add MinGW to PATH
        run: echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Install Ninja and CMake
        run: choco install ninja cmake --installargs 'ADD_CMAKE_TO_PATH=System' --yes --force --no-progress
        shell: powershell

      - name: Verify Tools (MinGW context)
        run: |
          echo "--- Verifying g++ (MinGW) ---" && g++ --version
          echo "--- Verifying ninja ---" && ninja --version
          echo "--- Verifying cmake ---" && cmake --version
        shell: bash

      - name: Configure DetourModKit (MinGW Debug + Tests)
        run: cmake --preset mingw-debug -DDMK_WARNINGS_AS_ERRORS=ON
        shell: bash

      - name: Build DetourModKit (MinGW Debug + Tests)
        run: cmake --build --preset mingw-debug --parallel
        shell: bash

      - name: Run DetourModKit Tests (MinGW Debug)
        run: ctest --preset mingw-debug --output-on-failure
        shell: bash

      - name: Configure DetourModKit (MinGW Release)
        # Tests stay ON in this tree: its ctest run exercises the Release objects, including the proxy-sensitive
        # out-of-memory contracts. It is NOT the shipping producer; its install goes to the equality scratch prefix.
        run: cmake --preset mingw-release -DDMK_WARNINGS_AS_ERRORS=ON -DDMK_BUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install_equality/mingw"
        shell: bash

      - name: Build DetourModKit (MinGW Release)
        run: cmake --build --preset mingw-release --parallel
        shell: bash

      - name: Run DetourModKit Tests (MinGW Release)
        # Exercise the Release binaries before packaging, not only the Debug config above.
        run: ctest --test-dir build/mingw-release --output-on-failure
        shell: bash

      - name: Assert the same-base replacement case executed (MinGW Release)
        # The loader-level module-replacement proof skips when this host will not map both fixture variants at the
        # reserved base, and a skip counts toward the green above. The ctest run wrote the case's own XML record; this
        # reads it back WITHOUT --skip-exit-code, so a candidate host that could not run the case is red here rather
        # than silently shipping an unproved contract.
        run: |
          python scripts/check_gtest_execution.py build/mingw-release/dmk_same_base_replacement.xml \
              --case MemoryTest.ModuleRangeFor_CompletedSameBaseReplacementReportsTheReplacementExtent \
              --property dmk_same_base_replacement=executed
        shell: bash

      - name: Run dump-capturing lifecycle soak (MinGW Release)
        # A red here is one of two things: a lifecycle proof regressed, or the soak could not put this runner's
        # machine-wide WER LocalDumps policy back. The second is not cosmetic on a self-hosted runner -- it leaves HKLM
        # pointed at a temporary dump directory -- so the script reports it rather than warning past it, and names the
        # exact values to repair.
        timeout-minutes: 45
        run: |
          python scripts/run_lifecycle_soak.py \
              --build-directory "build/mingw-release" \
              --dump-directory "$RUNNER_TEMP/dmk-lifecycle-dumps-mingw"
        shell: bash

      - name: Upload MinGW lifecycle failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-diagnostics-mingw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\dmk-lifecycle-dumps-mingw\*.dmp
            build\mingw-release\Testing\Temporary\LastTest.log
          if-no-files-found: ignore
          retention-days: 5
          compression-level: 9

      - name: Configure DetourModKit Package Producer (MinGW Release, tests OFF)
        # The SHIPPED prefix comes from a tests-OFF tree so no test seam (DMK_ENABLE_TEST_SEAMS) is compiled into
        # the released archive. The export-equality step below proves the two trees install an identical consumer
        # contract, so the tested tree and the shipped tree cannot drift apart unnoticed.
        run: |
          cmake -S . -B build/mingw-release-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DDMK_WARNINGS_AS_ERRORS=ON -DDMK_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install_package/mingw"
        shell: bash

      - name: Build DetourModKit Package Producer (MinGW Release)
        run: cmake --build build/mingw-release-package --parallel 4
        shell: bash

      - name: Install DetourModKit (MinGW Release)
        run: |
          cmake --install build/mingw-release-package
          cmake --install build/mingw-release
        shell: bash

      - name: Assert Export Equality (MinGW)
        # DMK_BUILD_TESTS must not change the installed contract: package config, ABI record, targets files, and
        # headers from the tests-OFF shipping prefix and the tests-ON equality prefix must be byte-identical.
        run: python scripts/check_export_equality.py "${{ github.workspace }}/install_package/mingw" "${{ github.workspace }}/install_equality/mingw"
        shell: bash

      - name: Verify Install Directory (MinGW)
        run: |
          $installDir = Join-Path -Path "${{ github.workspace }}" -ChildPath "install_package/mingw"
          if (-not (Test-Path $installDir -PathType Container)) {
            Write-Error "Install directory '$installDir' does not exist after cmake --install!"
            exit 1
          }
          Write-Output "Contents of '${installDir}':"
          Get-ChildItem -Path $installDir -Recurse | ForEach-Object { Write-Output $_.FullName }
          if (-not (Get-ChildItem -Path $installDir)) {
            Write-Warning "Install directory '${installDir}' is empty!"
          }
        shell: pwsh

      - name: Assert Install-Prefix Hygiene (MinGW)
        run: |
          # Prove the installed artifact upholds the v4 encapsulation contract: the SafetyHook backend stays hidden
          # (no include/safetyhook*, no lib/cmake/safetyhook), no deleted legacy public header or private engine ships,
          # and the archives + package config + public umbrella that a find_package consumer needs are all present.
          python scripts/check_install_prefix.py "${{ github.workspace }}/install_package/mingw"
        shell: bash

      - name: Assert No Test Seams (MinGW)
        run: |
          # A tests-OFF (shipping) archive must export no test seam: an unguarded *_for_test / g_*_override /
          # g_*_probe symbol leaks a private entry point or mutable hook the export-equality gate cannot see.
          # The vendored backend archive ships in the same prefix and carries its own seam (the post-commit
          # trap_threads override), so it is scanned too; DMK's archive alone would not catch a backend leak.
          archive=$(ls "${{ github.workspace }}"/install_package/mingw/lib*/libDetourModKit.a)
          python scripts/check_no_test_seams.py "$archive"
          backend=$(ls "${{ github.workspace }}"/install_package/mingw/lib*/libsafetyhook.a)
          python scripts/check_no_test_seams.py "$backend"
        shell: bash

      - name: Assert Emit Path Has No Emulated TLS (MinGW)
        run: |
          # MinGW lowers every C++ and GNU thread_local spelling to __emutls_get_address, which allocates on a
          # thread's first touch and calls abort() when that allocation fails. Arbitrary host threads reach the
          # dispatcher, input-delivery marker, and SafetyHook route path, where SIGABRT passes through every catch
          # frame. Which mechanism the source compiled to is visible only in emitted symbols. The tests-ON trees
          # enforce the same rule through EmitPathHasNoEmulatedTls, but the shipped prefix comes from the tests-OFF
          # package tree and the export-equality gate compares archive membership, not object code. Scan both shipped
          # archives so the rule holds for the binary a consumer actually links.
          archive=$(ls "${{ github.workspace }}"/install_package/mingw/lib*/libDetourModKit.a)
          backend=$(ls "${{ github.workspace }}"/install_package/mingw/lib*/libsafetyhook.a)
          python scripts/check_emit_tls.py "$archive" "$backend"
        shell: bash

      - name: Smoke Test Installed Package (MinGW)
        run: |
          cmake -S tests/package_smoke -B build/package-smoke-mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDetourModKit_DIR="${{ github.workspace }}/install_package/mingw/lib/cmake/DetourModKit" \
            -DCMAKE_CXX_COMPILER=g++
          cmake --build build/package-smoke-mingw --parallel
          ctest --test-dir build/package-smoke-mingw --output-on-failure
        shell: bash

      - name: Build-Tree Consumer Proof (MinGW)
        # The other half of the packaging contract: find_package consumers are covered by the smoke test above, and
        # add_subdirectory consumers by this one. It asserts at compile time that no backend include path, backend
        # macro, NOMINMAX, or test-only STL pin reaches a consumer's command line, and running it proves the
        # $<LINK_ONLY:...> backend archive chain still links. Release rather than pr-check.yml's Debug: this job
        # decides a Release candidate.
        run: |
          cmake -S tests/package_build_tree -B build/package-build-tree-mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DDMK_WARNINGS_AS_ERRORS=ON
          cmake --build build/package-build-tree-mingw --parallel 4
          ctest --test-dir build/package-build-tree-mingw --output-on-failure
        shell: bash

      - name: Dual-Config Package Matrix (MinGW)
        # Reproduce the same-prefix package in the release workflow and verify coexistence, ABI rejection, and exact
        # configuration selection from one multi-config consumer.
        run: |
          cmake --preset mingw-multi
          cmake --build --preset mingw-multi-debug --parallel 4
          cmake --build --preset mingw-multi-release --parallel 4
          rm -rf "${{ github.workspace }}/install_matrix/mingw"
          rm -rf "${{ github.workspace }}/install_matrix/mingw-debug-reference"
          cmake --install build/mingw-multi --config Debug --prefix "${{ github.workspace }}/install_matrix/mingw"
          cmake --install build/mingw-multi --config Debug \
            --prefix "${{ github.workspace }}/install_matrix/mingw-debug-reference"
          cmake --install build/mingw-multi --config Release --prefix "${{ github.workspace }}/install_matrix/mingw"
          python scripts/check_install_prefix.py "${{ github.workspace }}/install_matrix/mingw"
          python scripts/check_package_matrix.py "${{ github.workspace }}/install_matrix/mingw" \
            --configs Debug Release \
            --reference-prefix "${{ github.workspace }}/install_matrix/mingw-debug-reference"
          python scripts/check_abi_reject.py "${{ github.workspace }}/install_matrix/mingw" --cxx g++
          cmake -S tests/package_dual_config -B build/package-dual-config-mingw -G "Ninja Multi-Config" \
            -DCMAKE_CXX_COMPILER=g++ \
            -DDetourModKit_DIR="${{ github.workspace }}/install_matrix/mingw/lib/cmake/DetourModKit"
          cmake --build build/package-dual-config-mingw --config Debug --parallel 4
          cmake --build build/package-dual-config-mingw --config Release --parallel 4
          ctest --test-dir build/package-dual-config-mingw -C Debug --output-on-failure
          ctest --test-dir build/package-dual-config-mingw -C Release --output-on-failure
        shell: bash

      - name: Determine Artifact Name (MinGW)
        id: determine-artifact-name-mingw
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version_tag_safe = $env:INPUT_VERSION.Replace("+", "_plus_")
          $artifact_name = "DetourModKit_MinGW_v${version_tag_safe}.zip"
          echo "ARTIFACT_NAME=$artifact_name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh

      - name: Create ZIP archive (MinGW)
        run: |
          $sourcePath = Join-Path -Path "${{ github.workspace }}" -ChildPath "install_package/mingw"
          Compress-Archive -Path $sourcePath\* -DestinationPath ${{ steps.determine-artifact-name-mingw.outputs.ARTIFACT_NAME }} -Force
        shell: pwsh

      - name: Upload MinGW Artifact for Release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mingw-package
          path: ${{ steps.determine-artifact-name-mingw.outputs.ARTIFACT_NAME }}

  build-msvc:
    name: Build for MSVC (Visual Studio)
    runs-on: windows-latest
    timeout-minutes: 120
    needs: validate-version
    outputs:
      artifact_name: ${{ steps.determine-artifact-name-msvc.outputs.ARTIFACT_NAME }}
      artifact_zip_filename: ${{ steps.determine-artifact-name-msvc.outputs.ARTIFACT_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          # Build-only checkout: no authenticated git operation runs here, so do not persist the token in .git/config.
          persist-credentials: false

      - name: Install Ninja and CMake
        run: choco install ninja cmake --installargs 'ADD_CMAKE_TO_PATH=System' --yes --force --no-progress
        shell: powershell

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Verify Tools (MSVC context)
        run: |
          echo "--- Verifying cl (MSVC) ---"
          cl 2>&1 | head -1
          echo "--- Verifying ninja ---"
          ninja --version
          echo "--- Verifying cmake ---"
          cmake --version
        shell: bash

      - name: Configure DetourModKit (MSVC Debug + Tests)
        run: cmake --preset msvc-debug -DDMK_WARNINGS_AS_ERRORS=ON
        shell: cmd

      - name: Build DetourModKit (MSVC Debug + Tests)
        run: cmake --build --preset msvc-debug --parallel 2
        shell: cmd

      - name: Run DetourModKit Tests (MSVC Debug)
        run: ctest --preset msvc-debug --output-on-failure
        shell: cmd

      - name: Configure DetourModKit (MSVC Release)
        # Tests stay ON in this tree: its ctest run exercises the Release objects, including the proxy-sensitive
        # out-of-memory contracts on the naturally proxy-free MSVC release STL. It is NOT the shipping producer;
        # its install goes to the equality scratch prefix.
        run: cmake --preset msvc-release -DDMK_WARNINGS_AS_ERRORS=ON -DDMK_BUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install_equality/msvc"
        shell: cmd

      - name: Build DetourModKit (MSVC Release)
        run: cmake --build --preset msvc-release --parallel 2
        shell: cmd

      - name: Run DetourModKit Tests (MSVC Release)
        # Exercise the Release binaries before packaging, mirroring the MinGW Release leg. Tests are not installed, so
        # this does not change the packaged prefix. This is the MSVC Release route for the fault-containment proofs:
        # the optimizer is what decides whether a guarded body's reads stay inside the span its filter declares, so the
        # Debug pass above is not a substitute.
        run: ctest --test-dir build/msvc-release --output-on-failure
        shell: cmd

      - name: Assert the same-base replacement case executed (MSVC Release)
        # Same rule as the MinGW producer: the ctest run above wrote the case's XML record, and this reads it back
        # without a skip escape, so an unavailable exact-base mapping fails this candidate host.
        run: |
          python scripts/check_gtest_execution.py build/msvc-release/dmk_same_base_replacement.xml \
              --case MemoryTest.ModuleRangeFor_CompletedSameBaseReplacementReportsTheReplacementExtent \
              --property dmk_same_base_replacement=executed
        shell: bash

      - name: Run dump-capturing lifecycle soak (MSVC Release)
        # Same two failure modes as the MinGW leg: a regressed lifecycle proof, or WER LocalDumps policy this runner
        # was left holding.
        timeout-minutes: 45
        run: |
          python scripts/run_lifecycle_soak.py \
              --build-directory "build/msvc-release" \
              --dump-directory "$RUNNER_TEMP/dmk-lifecycle-dumps-msvc"
        shell: bash

      - name: Upload MSVC lifecycle failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-diagnostics-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\dmk-lifecycle-dumps-msvc\*.dmp
            build\msvc-release\Testing\Temporary\LastTest.log
          if-no-files-found: ignore
          retention-days: 5
          compression-level: 9

      - name: Configure DetourModKit Package Producer (MSVC Release, tests OFF)
        # The SHIPPED prefix comes from a tests-OFF tree so no test seam is compiled into the released archive;
        # the export-equality step proves the tested tree and the shipped tree install an identical contract.
        run: |
          cmake -S . -B build/msvc-release-package -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ^
            -DDMK_WARNINGS_AS_ERRORS=ON -DDMK_BUILD_TESTS=OFF ^
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install_package/msvc"
        shell: cmd

      - name: Build DetourModKit Package Producer (MSVC Release)
        run: cmake --build build/msvc-release-package --parallel 2
        shell: cmd

      - name: Install DetourModKit (MSVC Release)
        run: |
          cmake --install build/msvc-release-package
          if errorlevel 1 exit /b 1
          cmake --install build/msvc-release
        shell: cmd

      - name: Assert Export Equality (MSVC)
        # DMK_BUILD_TESTS must not change the installed contract: package config, ABI record, targets files, and
        # headers from the tests-OFF shipping prefix and the tests-ON equality prefix must be byte-identical.
        run: python scripts/check_export_equality.py "${{ github.workspace }}/install_package/msvc" "${{ github.workspace }}/install_equality/msvc"
        shell: bash

      - name: Verify Install Directory (MSVC)
        run: |
          $installDir = Join-Path -Path "${{ github.workspace }}" -ChildPath "install_package/msvc"
          if (-not (Test-Path $installDir -PathType Container)) {
            Write-Error "Install directory '$installDir' does not exist after cmake --install!"
            exit 1
          }
          Write-Output "Contents of '${installDir}':"
          Get-ChildItem -Path $installDir -Recurse | ForEach-Object { Write-Output $_.FullName }
          if (-not (Get-ChildItem -Path $installDir)) {
            Write-Warning "Install directory '${installDir}' is empty!"
          }
        shell: pwsh

      - name: Assert Install-Prefix Hygiene (MSVC)
        run: python scripts/check_install_prefix.py "${{ github.workspace }}/install_package/msvc"
        shell: bash

      - name: Assert No Test Seams (MSVC)
        run: |
          # A tests-OFF (shipping) archive must export no test seam; dumpbin comes from the MSVC dev environment.
          # The vendored backend archive ships alongside and carries its own seam, so it is scanned too.
          archive=$(ls "${{ github.workspace }}"/install_package/msvc/lib*/libDetourModKit.lib)
          python scripts/check_no_test_seams.py "$archive"
          backend=$(ls "${{ github.workspace }}"/install_package/msvc/lib*/safetyhook.lib)
          python scripts/check_no_test_seams.py "$backend"
        shell: bash

      - name: Smoke Test Installed Package (MSVC)
        run: |
          cmake -S tests/package_smoke -B build/package-smoke-msvc -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DDetourModKit_DIR="${{ github.workspace }}/install_package/msvc/lib/cmake/DetourModKit" ^
            -DCMAKE_CXX_COMPILER=cl && ^
          cmake --build build/package-smoke-msvc --parallel && ^
          ctest --test-dir build/package-smoke-msvc --output-on-failure
        shell: cmd

      - name: Build-Tree Consumer Proof (MSVC)
        # The add_subdirectory half of the packaging contract, mirroring the MinGW producer at the Release
        # configuration this job is deciding.
        run: |
          cmake -S tests/package_build_tree -B build/package-build-tree-msvc -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ^
            -DDMK_WARNINGS_AS_ERRORS=ON
          if errorlevel 1 exit /b 1
          cmake --build build/package-build-tree-msvc --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build/package-build-tree-msvc --output-on-failure
        shell: cmd

      - name: Dual-Config Package Matrix (MSVC)
        # The same prefix must serve Debug (/MDd, _ITERATOR_DEBUG_LEVEL=2) and Release (/MD) without cross-linking;
        # a wrong-configuration archive surfaces as LNK2038.
        run: |
          cmake --preset msvc-multi
          if errorlevel 1 exit /b 1
          cmake --build --preset msvc-multi-debug --parallel 2
          if errorlevel 1 exit /b 1
          cmake --build --preset msvc-multi-release --parallel 2
          if errorlevel 1 exit /b 1
          if exist "${{ github.workspace }}\install_matrix\msvc" ^
            rmdir /s /q "${{ github.workspace }}\install_matrix\msvc"
          if exist "${{ github.workspace }}\install_matrix\msvc-debug-reference" ^
            rmdir /s /q "${{ github.workspace }}\install_matrix\msvc-debug-reference"
          cmake --install build/msvc-multi --config Debug --prefix "${{ github.workspace }}/install_matrix/msvc"
          if errorlevel 1 exit /b 1
          cmake --install build/msvc-multi --config Debug ^
            --prefix "${{ github.workspace }}/install_matrix/msvc-debug-reference"
          if errorlevel 1 exit /b 1
          cmake --install build/msvc-multi --config Release --prefix "${{ github.workspace }}/install_matrix/msvc"
          if errorlevel 1 exit /b 1
          python scripts/check_install_prefix.py "${{ github.workspace }}/install_matrix/msvc"
          if errorlevel 1 exit /b 1
          python scripts/check_package_matrix.py "${{ github.workspace }}/install_matrix/msvc" --configs Debug Release ^
            --reference-prefix "${{ github.workspace }}/install_matrix/msvc-debug-reference"
          if errorlevel 1 exit /b 1
          python scripts/check_abi_reject.py "${{ github.workspace }}/install_matrix/msvc" --cxx cl
          if errorlevel 1 exit /b 1
          cmake -S tests/package_dual_config -B build/package-dual-config-msvc -G "Ninja Multi-Config" ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DDetourModKit_DIR="${{ github.workspace }}/install_matrix/msvc/lib/cmake/DetourModKit"
          if errorlevel 1 exit /b 1
          cmake --build build/package-dual-config-msvc --config Debug --parallel 2
          if errorlevel 1 exit /b 1
          cmake --build build/package-dual-config-msvc --config Release --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build/package-dual-config-msvc -C Debug --output-on-failure
          if errorlevel 1 exit /b 1
          ctest --test-dir build/package-dual-config-msvc -C Release --output-on-failure
        shell: cmd

      - name: Determine Artifact Name (MSVC)
        id: determine-artifact-name-msvc
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version_tag_safe = $env:INPUT_VERSION.Replace("+", "_plus_")
          $artifact_name = "DetourModKit_MSVC_v${version_tag_safe}.zip"
          echo "ARTIFACT_NAME=$artifact_name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh

      - name: Create ZIP archive (MSVC)
        run: |
          $sourcePath = Join-Path -Path "${{ github.workspace }}" -ChildPath "install_package/msvc"
          Compress-Archive -Path $sourcePath\* -DestinationPath ${{ steps.determine-artifact-name-msvc.outputs.ARTIFACT_NAME }} -Force
        shell: pwsh

      - name: Upload MSVC Artifact for Release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msvc-package
          path: ${{ steps.determine-artifact-name-msvc.outputs.ARTIFACT_NAME }}

  benchmark-evidence:
    name: Benchmark evidence
    runs-on: windows-latest
    timeout-minutes: 90
    needs: validate-version
    # Deterministic benchmark correctness is release evidence, so it runs on every dispatch including preflight. The
    # wall-clock thresholds each executable records are NOT enforced here: a shared runner cannot tell a regression
    # from a noisy neighbour, so check_benchmark_results.py is invoked without --stable-host and only the deterministic
    # gates, the record grammar, and the terminal sentinel decide this job.
    #
    # The toolchain is provisioned exactly as build-mingw provisions it. Evidence produced by whatever compiler the
    # runner image happens to ship would not describe the archives this same workflow releases, and the image's
    # compiler changes without a commit here.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false

      - name: Cache MinGW
        id: cache-mingw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\ProgramData\chocolatey\lib\mingw
          key: ${{ runner.os }}-mingw-13.2.0-v2

      - name: Install MinGW (if not cached)
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        run: choco install mingw --version=13.2.0 --yes --force --no-progress
        shell: powershell

      - name: Add MinGW to PATH
        run: echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Install Ninja and CMake
        run: choco install ninja cmake --installargs 'ADD_CMAKE_TO_PATH=System' --yes --force --no-progress
        shell: powershell

      - name: Verify Tools (MinGW context)
        run: |
          echo "--- Verifying g++ (MinGW) ---" && g++ --version
          echo "--- Verifying ninja ---" && ninja --version
          echo "--- Verifying cmake ---" && cmake --version
        shell: bash

      - name: Configure and build the benchmarks (MinGW Release)
        run: |
          cmake --preset mingw-release -DDMK_BUILD_BENCHMARKS=ON
          cmake --build build/mingw-release --parallel \
            --target DetourModKit_bench DetourModKit_bench_scanner \
                     DetourModKit_bench_memory DetourModKit_bench_logger dmk_bench_gate_probe
        shell: bash

      - name: Run the benchmarks
        # Each executable exits nonzero on a failed deterministic gate, so a `set -e` shell already fails here; the
        # captures are what the checker then reads for malformed, missing and truncated records.
        run: |
          # Match the executable exactly. A prefix match can select a build artifact that merely starts with the
          # target name, and an empty match would make dirname yield "." and fail four steps later with a path error
          # instead of naming the real problem here.
          SCANNER="$(find build/mingw-release -name 'DetourModKit_bench_scanner.exe' -type f | head -n 1)"
          if [ -z "${SCANNER}" ]; then
            echo "::error::No DetourModKit_bench_scanner.exe under build/mingw-release; the benchmark build produced nothing to measure."
            exit 1
          fi
          BIN="$(dirname "${SCANNER}")"
          mkdir -p bench-results
          "${BIN}/DetourModKit_bench_scanner" | tee bench-results/scanner.txt
          "${BIN}/DetourModKit_bench_memory" | tee bench-results/memory.txt
          "${BIN}/DetourModKit_bench_logger" | tee bench-results/logger.txt
          "${BIN}/DetourModKit_bench" | tee bench-results/dispatcher.txt
        shell: bash

      - name: Check the recorded evidence
        # The --require list names one gate per benchmark. A suite that stopped emitting its gate, or a benchmark that
        # was dropped from the step above, then fails here instead of shrinking the evidence silently.
        run: |
          LEDGER_PROBE="$(find build/mingw-release -name 'dmk_bench_gate_probe.exe' -type f | head -n 1)"
          if [ -z "${LEDGER_PROBE}" ]; then
            echo "::error::No dmk_bench_gate_probe.exe under build/mingw-release; the producer boundary was not built."
            exit 1
          fi
          python scripts/test_check_benchmark_results.py --ledger-probe "${LEDGER_PROBE}"
          python scripts/check_benchmark_results.py bench-results/*.txt \
            --require scanner.scenario_anchor_agreement \
            --require scanner.verify_workload_no_match \
            --require scanner.resolver_batch_matches_serial \
            --require memory.chain_walk_resolves_leaf \
            --require logger.enqueue_reached_the_queue \
            --require dispatcher.reentrant_subscribe_rejected
        shell: bash

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: benchmark-evidence
          path: bench-results

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-mingw, build-msvc, benchmark-evidence]
    # The mode gate is what makes preflight a real mode rather than a label: this is the only job that holds
    # RELEASE_TOKEN, creates the annotated tag, or creates the GitHub Release, and it does not run at all unless the
    # dispatch asked to publish. The ref and exact-SHA refusals below stay in force on top of it.
    if: ${{ inputs.mode == 'publish' }}

    steps:
      - name: Assert the dispatch ref may publish a tag
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        # Only refs/heads/main may publish the immutable event SHA that the exact-candidate gate checked. Compare the
        # full ref, not github.ref_name, which reports "main" for both refs/heads/main and a tag named main. Exact
        # equality against one literal is fail closed: an empty, renamed, unanticipated or refs/tags/* ref all take the
        # refusal path. The guard sits in this job rather than in validate-version so a release-branch dispatch still
        # runs both build jobs and records the archive, seam, export-equality, package-matrix and ABI gates before the
        # main merge. It precedes the credentialed checkout, so a refused dispatch never writes RELEASE_TOKEN into
        # .git/config.
        run: |
          RELEASE_REF="refs/heads/main"
          echo "Dispatch ref: ${DISPATCH_REF} at ${DISPATCH_SHA}"
          if [ "${DISPATCH_REF}" != "${RELEASE_REF}" ]; then
            echo "::error::Release workflow was dispatched from '${DISPATCH_REF}'. Only '${RELEASE_REF}' may publish a release tag. The build jobs above have already run and their gate results stand; merge the release commit to main, confirm origin/main is the release HEAD, then dispatch again from main to tag."
            exit 1
          fi
          echo "Dispatch ref check passed."
        shell: bash

      - name: Download MinGW artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mingw-package
          path: mingw_package_dir

      - name: Download MSVC artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msvc-package
          path: msvc_package_dir

      - name: List downloaded artifacts for verification
        run: |
          echo "--- MinGW Package Contents ---"
          ls -R mingw_package_dir
          echo "--- MSVC Package Contents ---"
          ls -R msvc_package_dir

      - name: Prepare file list for release
        id: file_list
        run: |
          MINGW_ZIP_NAME="${{ needs.build-mingw.outputs.artifact_zip_filename }}"
          MSVC_ZIP_NAME="${{ needs.build-msvc.outputs.artifact_zip_filename }}"

          FILES_STRING="mingw_package_dir/$MINGW_ZIP_NAME,msvc_package_dir/$MSVC_ZIP_NAME"

          test -f "mingw_package_dir/$MINGW_ZIP_NAME"
          test -f "msvc_package_dir/$MSVC_ZIP_NAME"
          unzip -t "mingw_package_dir/$MINGW_ZIP_NAME"
          unzip -t "msvc_package_dir/$MSVC_ZIP_NAME"
          echo "Files to release: $FILES_STRING"
          echo "FILES_TO_RELEASE=$FILES_STRING" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout code for annotated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes the annotated release tag, so it DELIBERATELY persists RELEASE_TOKEN (all four build
          # checkouts set persist-credentials: false). Do not add persist-credentials: false here, or the
          # `git push origin <tag>` step below fails to authenticate.
          token: ${{ secrets.RELEASE_TOKEN }}
          path: release-source

      - name: Create or verify annotated tag
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TITLE: ${{ github.event.inputs.release_title }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        working-directory: release-source
        run: |
          TITLE="${RELEASE_TITLE}"
          VERSION="v${RELEASE_VERSION}"
          TAG_MESSAGE="${TITLE:-DetourModKit ${VERSION}}"
          REMOTE_REF="$(git ls-remote --tags origin "refs/tags/${VERSION}" | awk 'NR == 1 { print $1 }')"
          REMOTE_TARGET="$(git ls-remote --tags origin "refs/tags/${VERSION}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -n "${REMOTE_REF}" ] && [ -z "${REMOTE_TARGET}" ]; then
            echo "::error::Existing tag ${VERSION} is lightweight; the release contract requires an annotated tag."
            exit 1
          fi
          if [ -n "${REMOTE_TARGET}" ]; then
            if [ "${REMOTE_TARGET}" != "${EXPECTED_SHA}" ]; then
              echo "::error::Existing tag ${VERSION} resolves to ${REMOTE_TARGET}, not exact candidate ${EXPECTED_SHA}."
              exit 1
            fi
            echo "Existing tag ${VERSION} already resolves to the exact candidate;" \
              "reusing it after a prior partial run."
            exit 0
          fi
          git config user.name "Quang Trinh"
          git config user.email "khacquang.trinh@gmail.com"
          git tag -a "$VERSION" -m "$TAG_MESSAGE" "${EXPECTED_SHA}"
          git push origin "refs/tags/${VERSION}"

      - name: Create GitHub Release
        # SHA-pinned (supply-chain risk mitigated). Retained over a `gh release create` run-block because it passes the
        # untrusted, user-supplied `changelog` workflow input as a parameter rather than interpolating it into a shell
        # command, so there is no shell-injection surface a run-block would have to hand-guard.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ steps.file_list.outputs.FILES_TO_RELEASE }}
          fail_on_unmatched_files: true
          tag_name: v${{ github.event.inputs.version }}
          name: DetourModKit v${{ github.event.inputs.version }}
          body: |
            **Release Title:** ${{ github.event.inputs.release_title }}
            **Version:** ${{ github.event.inputs.version }}

            **Changelog:**
            ${{ github.event.inputs.changelog }}

            **Artifacts:**
            This release includes packages for different build environments. Both packages ensure library names are prefixed with `lib` for consistency (e.g., `libDetourModKit.a`, `libDetourModKit.lib`).

            *   `${{ needs.build-mingw.outputs.artifact_name }}`: Built with MinGW (g++). Contains `libDetourModKit.a`, `libsafetyhook.a`, `libZydis.a`, `libZycore.a`, headers, and CMake config files. `find_package` links the transitive static chain via the `DetourModKit::deps` imported target.
            *   `${{ needs.build-msvc.outputs.artifact_name }}`: Built with MSVC (Visual Studio 2022). Contains `libDetourModKit.lib`, `safetyhook.lib`, `Zydis.lib`, `Zycore.lib`, headers, and CMake config files. Same `DetourModKit::deps` wiring as the MinGW package.

            These packages are ready to be used by other CMake projects via `find_package(DetourModKit)`.
            See README for detailed usage instructions.
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          token: ${{ secrets.RELEASE_TOKEN }}
